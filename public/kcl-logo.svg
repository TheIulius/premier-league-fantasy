<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c0032" />
      <stop offset="50%" stop-color="#19001e" />
      <stop offset="100%" stop-color="#0f0013" />
    </linearGradient>

    <linearGradient id="neonBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#04f5ff" />
      <stop offset="100%" stop-color="#ab00ff" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259" />
      <stop offset="100%" stop-color="#ffa751" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#00ff87" />
      <stop offset="100%" stop-color="#00bd63" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00ff87" flood-opacity="0.6" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Outer Crest Circle with Gradient Neon Border -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="url(#neonBorder)" stroke-width="5" />
  <circle cx="100" cy="100" r="88" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" stroke-dasharray="3,3" />

  <!-- Stars at top -->
  <g fill="url(#goldGrad)" transform="translate(100, 20) scale(0.8)">
    <polygon points="0,-7 2,-2 7,-2 3,2 5,7 0,4 -5,7 -3,2 -7,-2 -2,-2" />
    <polygon points="-22,-5 -20,-1 -16,-1 -19,2 -18,6 -22,3 -26,6 -25,2 -28,-1 -24,-1" />
    <polygon points="22,-5 24,-1 28,-1 25,2 26,6 22,3 18,6 19,2 16,-1 20,-1" />
  </g>

  <!-- Official Komarovi School Emblem -->
  <g filter="url(#shadow)">
    <image href="data:image/png;base64," x="66" y="32" width="68" height="68" />
  </g>

  <!-- Separator Arc -->
  <path d="M 32 110 Q 100 118 168 110" fill="none" stroke="url(#neonBorder)" stroke-width="2.5" opacity="0.85" />

  <!-- Bold Athletic KCL Text -->
  <text x="100" y="152"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Inter, Impact, sans-serif"
        font-weight="900"
        font-size="38"
        letter-spacing="5"
        fill="#000000"
        opacity="0.75">
    KCL
  </text>
  <text x="100" y="150"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Inter, Impact, sans-serif"
        font-weight="900"
        font-size="38"
        letter-spacing="5"
        fill="url(#textGrad)"
        filter="url(#glow)">
    KCL
  </text>

  <!-- Subtitle -->
  <text x="100" y="174"
        text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif"
        font-weight="800"
        font-size="8"
        letter-spacing="2"
        fill="#ffffff"
        opacity="0.85">
    CHARITY LEAGUE
  </text>
</svg>
